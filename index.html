        { q: "පළමු ලෝක යුද්ධයට ආසන්නතම හේතුව", a: "සරයේවෝ සිද්ධිය" },
        { q: "ජාතීන්ගේ සංගමය පිහිටුවීමට මුලික වූ ජනාධිපති", a: "වුඩ්රෝ විල්සන්" },
        { q: "II ලෝක යුද්ධයේ ජර්මන් නායකයා", a: "ඇඩෝල්ෆ් හිට්ලර්" },
        { q: "පර්ල් වරායට පහර දීම", a: "ඇමරිකාව II ලෝක යුද්ධයට සම්බන්ධ වීමට හේතුව" },
        { q: "විනාශ වූ ජපන් නගර දෙක", a: "හිරෝෂිමාව, නාගසාකි" }
    ];

    const listContainer = document.getElementById('quiz-list');
    const countDisplay = document.getElementById('count');

    function displayQuestions(data) {
        listContainer.innerHTML = '';
        data.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'question-item';
            div.innerHTML = `
                <span class="q-text">${index + 1}. ${item.q} ?</span>
                <span class="a-text">${item.a}</span>
            `;
            listContainer.appendChild(div);
        });
        countDisplay.innerText = data.length;
    }

    function searchQuestions() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const filtered = questions.filter(item => 
            item.q.toLowerCase().includes(term) || 
            item.a.toLowerCase().includes(term)
        );
        displayQuestions(filtered);
    }

    // ආරම්භයේදී සියල්ල පෙන්වන්න
    displayQuestions(questions);
</script>

</body>
</html>
